<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计划助手</title>
    <style>
        :root {
            --primary: #6a85b6;
            --secondary: #bac8e0;
            --accent: #ff6b6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        .calendar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            margin-bottom: 15px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .calendar-day.has-tasks {
            background: var(--accent);
            font-weight: bold;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, var(--accent), #ff8e8e);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 20px;
            color: white;
            cursor: pointer;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .checkbox {
            width: 25px;
            height: 25px;
            border: 2px solid #ddd;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox.checked {
            background: #6bcd6b;
            border-color: #6bcd6b;
        }

        .priority {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .high { background: #ff6b6b; }
        .medium { background: #ffd93d; }
        .low { background: #6bcd6b; }

        @media (max-width: 480px) {
            input[type="text"] {
                font-size: 14px;
            }
            
            button {
                padding: 15px 20px;
            }
            
            .calendar-day {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>坚持做好每一个计划</h1>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <div class="calendar">
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">←</button>
                <h3 id="currentMonth"></h3>
                <button onclick="changeMonth(1)">→</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="input-group">
            <input type="text" placeholder="添加新任务..." id="taskInput">
            <button onclick="addTask()">添加</button>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn" onclick="filterTasks('all')">全部</button>
            <button class="filter-btn" onclick="filterTasks('active')">进行中</button>
            <button class="filter-btn" onclick="filterTasks('completed')">已完成</button>
        </div>

        <div class="task-list" id="taskList"></div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentDate = new Date();
        
        // 初始化日历
        function initCalendar() {
            const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月",
                              "7月", "8月", "9月", "10月", "11月", "12月"];
            document.getElementById('currentMonth').textContent = 
                `${currentDate.getFullYear()}年 ${monthNames[currentDate.getMonth()]}`;
            
            const calendarGrid = document.getElementById('calendarGrid');
            calendarGrid.innerHTML = '';
            
            const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const lastDay = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
            
            // 填充空白
            for (let i = 0; i < firstDay.getDay(); i++) {
                calendarGrid.appendChild(document.createElement('div'));
            }
            
            // 生成日期
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const date = new Date(currentDate.getFullYear(), currentDate.getMonth(), day);
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                dayElement.textContent = day;
                
                // 检查是否有任务
                const hasTasks = tasks.some(task => 
                    new Date(task.createdAt).toDateString() === date.toDateString()
                );
                if (hasTasks) dayElement.classList.add('has-tasks');
                
                dayElement.onclick = () => filterByDate(date);
                calendarGrid.appendChild(dayElement);
            }
        }
        
        function changeMonth(offset) {
            currentDate.setMonth(currentDate.getMonth() + offset);
            initCalendar();
        }
        
        function filterByDate(date) {
            const filteredTasks = tasks.filter(task => 
                new Date(task.createdAt).toDateString() === date.toDateString()
            );
            renderTasks('all', filteredTasks);
        }
        
        // 更新进度条
        function updateProgress() {
            const totalTasks = tasks.length;
            const completedTasks = tasks.filter(t => t.completed).length;
            const progress = totalTasks > 0 ? (completedTasks / totalTasks) * 100 : 0;
            document.getElementById('progressBar').style.width = `${progress}%`;
        }
        
        function renderTasks(filter = 'all', taskArray = tasks) {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';

            const filteredTasks = taskArray.filter(task => {
                if (filter === 'active') return !task.completed;
                if (filter === 'completed') return task.completed;
                return true;
            });

            filteredTasks.forEach((task, index) => {
                const taskItem = document.createElement('div');
                taskItem.className = `task-item ${task.completed ? 'completed' : ''}`;
                taskItem.innerHTML = `
                    <div class="priority ${task.priority}"></div>
                    <div class="checkbox ${task.completed ? 'checked' : ''}" 
                         onclick="toggleComplete(${index})"></div>
                    <div>${task.text}</div>
                    <div style="margin-left: auto;" onclick="deleteTask(${index})">🗑️</div>
                `;
                
                // 滑动删除功能
                let touchStartX = 0;
                taskItem.addEventListener('touchstart', e => {
                    touchStartX = e.touches[0].clientX;
                });

                taskItem.addEventListener('touchend', e => {
                    if (touchStartX - e.changedTouches[0].clientX > 50) {
                        deleteTask(index);
                    }
                });

                taskList.appendChild(taskItem);
            });
            
            updateProgress();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            if (input.value.trim()) {
                tasks.push({
                    text: input.value.trim(),
                    completed: false,
                    priority: 'medium',
                    createdAt: new Date()
                });
                input.value = '';
                saveTasks();
                initCalendar();
                renderTasks();
            }
        }

        function toggleComplete(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            initCalendar();
            renderTasks();
        }

        function filterTasks(type) {
            renderTasks(type);
        }

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // 初始化
        initCalendar();
        renderTasks();

        // 回车添加任务
        document.getElementById('taskInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });
    </script>
</body>
</html>
